<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compre seu Ingresso - TicketPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <i class="fa-solid fa-ticket text-indigo-500 text-2xl"></i>
        <span class="text-xl font-bold tracking-wide text-white">TicketPass</span>
      </a>
      <div class="flex items-center space-x-4">
        <a href="admin.html" class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg font-semibold flex items-center gap-2">
          <i class="fa-solid fa-user-shield"></i> Painel Admin
        </a>
      </div>
    </div>
  </header>

  <section class="relative bg-gradient-to-r from-indigo-900 to-purple-900 py-16 px-4">
    <div class="max-w-6xl mx-auto">
      <span class="bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/30">VENDAS ABERTAS</span>
      <h1 class="text-4xl md:text-6xl font-black mt-3 mb-2 text-white">SHOW FREI GILSON</h1>
      <p class="text-slate-300 flex items-center gap-2 text-sm md:text-base"><i class="fa-regular fa-calendar"></i> Em breve • 20:00h</p>
      <p class="text-slate-300 flex items-center gap-2 text-sm md:text-base mt-1"><i class="fa-solid fa-location-dot"></i> Floriano - PI</p>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 py-12 grid md:grid-cols-3 gap-8">
    <div class="md:col-span-2 space-y-6">
      <h2 class="text-2xl font-bold text-white mb-4">Escolha seu Ingresso</h2>
      <div id="container-lotes" class="space-y-4">
        <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-slate-400">Carregando lotes...</div>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit sticky top-24">
      <h3 class="text-xl font-bold text-white mb-4">Resumo do Pedido</h3>
      <form id="checkout-form" onsubmit="iniciarCheckout(event)" class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Seu nome completo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">CPF (Para o Bilhete)</label>
          <input type="text" id="cpf" required placeholder="000.000.000-00" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
        </div>
        <div class="border-t border-slate-800 pt-4 flex justify-between items-center">
          <span class="text-slate-400">Total:</span>
          <span id="valor-total" class="text-2xl font-black text-indigo-400">R$ 0,00</span>
        </div>
        <button type="submit" id="btn-comprar" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/30 transition">
          <i class="fa-solid fa-bolt mr-2"></i> GERAR PIX PARA PAGAMENTO
        </button>
      </form>
    </div>
  </main>

  <script>
    let loteSelecionadoId = null;
    let precoUnitario = 0;
    let quantidade = 1;
    let lotesDisponiveis = [];

    async function carregarLotesDisponiveis() {
      const container = document.getElementById('container-lotes');
      try {
        const res = await fetch('/api/admin/metrics');
        const data = await res.json();
        
        lotesDisponiveis = data.batches || [];

        if (lotesDisponiveis.length === 0) {
          container.innerHTML = '<div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-slate-400">Nenhum lote disponível no momento.</div>';
          return;
        }

        loteSelecionadoId = lotesDisponiveis[0].id;
        precoUnitario = parseFloat(lotesDisponiveis[0].price);

        container.innerHTML = lotesDisponiveis.map((lote, index) => `
          <div onclick="selecionarLote('${lote.id}', ${lote.price}, this)" 
               class="lote-card cursor-pointer bg-slate-900 border ${index === 0 ? 'border-indigo-500 bg-indigo-950/20' : 'border-slate-800'} hover:border-indigo-500/50 rounded-2xl p-6 flex items-center justify-between transition">
            <div>
              <div class="flex items-center gap-2">
                <input type="radio" name="lote-radio" ${index === 0 ? 'checked' : ''} class="accent-indigo-500">
                <h3 class="text-xl font-bold text-white">${lote.name}</h3>
              </div>
              <p class="text-sm text-slate-400 mt-1">Acesso garantido com QR Code seguro.</p>
              <span class="text-2xl font-extrabold text-indigo-400 mt-2 block">R$ ${parseFloat(lote.price).toFixed(2).replace('.', ',')}</span>
            </div>
            <div class="flex items-center space-x-3 bg-slate-800 rounded-lg p-2" onclick="event.stopPropagation()">
              <button type="button" onclick="alterarQtd(-1)" class="w-8 h-8 rounded-md bg-slate-700 hover:bg-slate-600 font-bold">-</button>
              <span id="qtd-ingresso" class="font-bold text-lg w-6 text-center">1</span>
              <button type="button" onclick="alterarQtd(1)" class="w-8 h-8 rounded-md bg-slate-700 hover:bg-slate-600 font-bold">+</button>
            </div>
          </div>
        `).join('');

        atualizarTotal();
      } catch (err) {
        console.error('Erro ao carregar lotes:', err);
      }
    }

    function selecionarLote(id, preco, el) {
      loteSelecionadoId = id;
      precoUnitario = parseFloat(preco);
      
      document.querySelectorAll('.lote-card').forEach(card => {
        card.classList.remove('border-indigo-500', 'bg-indigo-950/20');
        card.classList.add('border-slate-800');
        const radio = card.querySelector('input[type="radio"]');
        if (radio) radio.checked = false;
      });

      el.classList.remove('border-slate-800');
      el.classList.add('border-indigo-500', 'bg-indigo-950/20');
      const radio = el.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;

      atualizarTotal();
    }

    function alterarQtd(delta) {
      quantidade = Math.max(1, quantidade + delta);
      document.getElementById('qtd-ingresso').innerText = quantidade;
      atualizarTotal();
    }

    function atualizarTotal() {
      document.getElementById('valor-total').innerText = `R$ ${(quantidade * precoUnitario).toFixed(2).replace('.', ',')}`;
    }

    async function iniciarCheckout(e) {
      e.preventDefault();
      if (!loteSelecionadoId) {
        alert('Por favor, selecione um lote.');
        return;
      }

      const btn = document.getElementById('btn-comprar');
      btn.disabled = true;
      btn.innerText = "Gerando PIX de Pagamento...";

      const userId = crypto.randomUUID ? crypto.randomUUID() : '00000000-0000-0000-0000-000000000000';

      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            batchId: loteSelecionadoId,
            quantity: quantidade,
            userId: userId,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value
          })
        });
        const data = await res.json();

        if (res.ok) {
          // Encaminha explicitamente para a página de pagamento PIX
          window.location.href = `pagamento.html?orderId=${data.orderId}&amount=${data.totalAmount}&nome=${encodeURIComponent(document.getElementById('nome').value)}&cpf=${encodeURIComponent(document.getElementById('cpf').value)}&copiaECola=${encodeURIComponent(data.qrCodeCopiaECola || data.orderId)}`;
        } else {
          alert('Erro: ' + (data.error || 'Falha ao gerar cobrança'));
          btn.disabled = false;
          btn.innerText = "GERAR PIX PARA PAGAMENTO";
        }
      } catch (err) {
        alert('Erro de conexão com o servidor');
        btn.disabled = false;
        btn.innerText = "GERAR PIX PARA PAGAMENTO";
      }
    }

    carregarLotesDisponiveis();
  </script>
</body>
</html>
