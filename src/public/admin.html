<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador - Gestão de Ingressos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-user-shield text-indigo-500 text-2xl"></i>
      <h1 class="text-xl font-bold text-white">Painel do Administrador</h1>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg">Ir para a Loja</a>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Receita Total</p>
        <p id="total-revenue" class="text-3xl font-black text-emerald-400 mt-2">R$ 0,00</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Pedidos Pagos</p>
        <p id="total-orders" class="text-3xl font-black text-indigo-400 mt-2">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Ingressos Emitidos</p>
        <p id="valid-tickets" class="text-3xl font-black text-purple-400 mt-2">0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-calendar-plus mr-2 text-indigo-500"></i> Cadastrar Novo Show</h2>
        <form id="form-event" onsubmit="cadastrarEvento(event)" class="space-y-4">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Título do Evento</label>
            <input type="text" id="event-title" required placeholder="Ex: Show Frei Gilson" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Slug (URL amigável)</label>
            <input type="text" id="event-slug" required placeholder="ex: freigilson-floriano-pi" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
          </div>
          <button type="submit" id="btn-criar-evento" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl">Criar Evento</button>
        </form>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-layer-group mr-2 text-indigo-500"></i> Publicar Lote & Iniciar Estoque</h2>
        <form id="form-batch" onsubmit="cadastrarLote(event)" class="space-y-4">
          <div>
            <label class="text-xs text-slate-400 block mb-1">ID do Evento</label>
            <select id="select-event" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
              <option value="">Carregando eventos...</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-slate-400 block mb-1">Nome do Lote</label>
              <input type="text" id="batch-name" required placeholder="LOTE 01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">Preço (R$)</label>
              <input type="number" step="0.01" id="batch-price" required placeholder="100.00" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Quantidade de Ingressos (Estoque Redis)</label>
            <input type="number" id="batch-qty" required placeholder="1000" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
          </div>
          <button type="submit" id="btn-carregar-lote" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl">Carregar Lote no Redis</button>
        </form>
      </div>
    </div>

    <!-- TABELA DE GERENCIAMENTO DE LOTES -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
      <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-list-check mr-2 text-indigo-500"></i> Gestão de Lotes Cadastrados</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
            <tr>
              <th class="p-3">Evento</th>
              <th class="p-3">Nome do Lote</th>
              <th class="p-3">Preço</th>
              <th class="p-3">Estoque Total</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="table-batches-body" class="divide-y divide-slate-800">
            <tr>
              <td colspan="5" class="p-4 text-center text-slate-500">Carregando lotes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL DE EDIÇÃO -->
  <div id="modal-edit" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-indigo-500"></i> Editar Lote</h3>
      <input type="hidden" id="edit-batch-id">
      <div>
        <label class="text-xs text-slate-400 block mb-1">Nome do Lote</label>
        <input type="text" id="edit-batch-name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Preço (R$)</label>
        <input type="number" step="0.01" id="edit-batch-price" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Quantidade Total (Redis)</label>
        <input type="number" id="edit-batch-qty" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white">
      </div>
      <div class="flex space-x-3 pt-2">
        <button onclick="salvarEdicaoLote()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl">Salvar Alterações</button>
        <button onclick="fecharModalEdit()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-3 rounded-xl">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    async function carregarMetricas() {
      try {
        const res = await fetch('/api/admin/metrics');
        const data = await res.json();
        
        if (data.metrics) {
          document.getElementById('total-revenue').innerText = `R$ ${parseFloat(data.metrics.totalRevenue || 0).toFixed(2).replace('.', ',')}`;
          document.getElementById('total-orders').innerText = data.metrics.totalOrders || 0;
          document.getElementById('valid-tickets').innerText = data.metrics.validTickets || 0;
        }

        const select = document.getElementById('select-event');
        select.innerHTML = '<option value="">Selecione um evento...</option>';
        if (data.events && data.events.length > 0) {
          data.events.forEach(ev => {
            select.innerHTML += `<option value="${ev.id}">${ev.title}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Nenhum evento cadastrado ainda</option>';
        }

        const tbody = document.getElementById('table-batches-body');
        if (data.batches && data.batches.length > 0) {
          tbody.innerHTML = '';
          data.batches.forEach(b => {
            tbody.innerHTML += `
              <tr class="hover:bg-slate-800/50">
                <td class="p-3 font-semibold text-white">${b.event_title || 'Show Frei Gilson'}</td>
                <td class="p-3">${b.name}</td>
                <td class="p-3 text-emerald-400 font-bold">R$ ${parseFloat(b.price).toFixed(2)}</td>
                <td class="p-3 font-mono">${b.total_quantity}</td>
                <td class="p-3 text-right space-x-2">
                  <button onclick="abrirModalEdit('${b.id}', '${b.name}', ${b.price}, ${b.total_quantity})" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-400 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition">✏️ Editar</button>
                  <button onclick="apagarLote('${b.id}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition">🗑️ Apagar</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">Nenhum lote publicado ainda.</td></tr>';
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    async function cadastrarEvento(e) {
      e.preventDefault();
      const title = document.getElementById('event-title').value;
      const slug = document.getElementById('event-slug').value;
      await fetch('/api/admin/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, slug })
      });
      alert('✅ Evento cadastrado com sucesso!');
      await carregarMetricas();
    }

    async function cadastrarLote(e) {
      e.preventDefault();
      const eventId = document.getElementById('select-event').value;
      const name = document.getElementById('batch-name').value;
      const price = parseFloat(document.getElementById('batch-price').value);
      const totalQuantity = parseInt(document.getElementById('batch-qty').value);
      
      const res = await fetch('/api/admin/batches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventId, name, price, totalQuantity })
      });
      
      if (res.ok) {
        alert('✅ Lote publicado e estoque carregado no Redis!');
        await carregarMetricas();
      } else {
        alert('❌ Erro ao criar lote.');
      }
    }

    function abrirModalEdit(id, name, price, qty) {
      document.getElementById('edit-batch-id').value = id;
      document.getElementById('edit-batch-name').value = name;
      document.getElementById('edit-batch-price').value = price;
      document.getElementById('edit-batch-qty').value = qty;
      document.getElementById('modal-edit').classList.remove('hidden');
    }

    function fecharModalEdit() {
      document.getElementById('modal-edit').classList.add('hidden');
    }

    async function salvarEdicaoLote() {
      const id = document.getElementById('edit-batch-id').value;
      const name = document.getElementById('edit-batch-name').value;
      const price = parseFloat(document.getElementById('edit-batch-price').value);
      const totalQuantity = parseInt(document.getElementById('edit-batch-qty').value);

      const res = await fetch(`/api/admin/batches/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, totalQuantity })
      });
      if (res.ok) {
        alert('✅ Lote atualizado com sucesso!');
        fecharModalEdit();
        await carregarMetricas();
      }
    }

    async function apagarLote(id) {
      if (!confirm('Deseja apagar este lote?')) return;
      const res = await fetch(`/api/admin/batches/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert('🗑️ Lote apagado com sucesso!');
        await carregarMetricas();
      }
    }

    carregarMetricas();
  </script>
</body>
</html>
