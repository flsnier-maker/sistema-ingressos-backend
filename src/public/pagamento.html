<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento PIX - TicketPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-6 shadow-2xl">
    
    <div>
      <span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30 flex items-center justify-center gap-1 w-fit mx-auto">
        <i class="fa-solid fa-clock"></i> AGUARDANDO PAGAMENTO
      </span>
      <h1 class="text-2xl font-black text-white mt-3">Pague com PIX</h1>
      <p class="text-xs text-slate-400 mt-1">Escaneie o QR Code abaixo no app do seu banco</p>
    </div>

    <!-- QR Code PIX -->
    <div class="bg-white p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner">
      <div id="qrcode-pix" class="flex justify-center items-center"></div>
      <p class="text-xs font-bold text-slate-800 mt-2">Valor: <span id="pix-valor" class="text-indigo-600 font-extrabold">R$ 0,00</span></p>
    </div>

    <!-- Cronômetro de Expiração -->
    <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
      <p class="text-xs text-slate-400">Tempo restante para pagamento:</p>
      <p id="timer" class="text-xl font-mono font-bold text-amber-400 mt-0.5">15:00</p>
    </div>

    <!-- Botão Copia e Cola -->
    <div class="space-y-2">
      <button onclick="copiarPix()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
        <i class="fa-regular fa-copy"></i> Copiar Código PIX (Copia e Cola)
      </button>
      <p id="copy-msg" class="text-xs text-emerald-400 hidden font-bold">✓ Código copiado com sucesso!</p>
    </div>

    <!-- Simulação de Teste Manual -->
    <div class="border-t border-slate-800 pt-4">
      <button onclick="simularAprovacao()" class="text-xs text-slate-500 hover:text-slate-300 underline">
        [Modo Teste] Simular Aprovação do Pagamento
      </button>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    const amount = urlParams.get('amount') || '0.00';
    const nome = urlParams.get('nome') || '';
    const cpf = urlParams.get('cpf') || '';
    const copiaECola = urlParams.get('copiaECola') || orderId;

    document.getElementById('pix-valor').innerText = `R$ ${parseFloat(amount).toFixed(2).replace('.', ',')}`;

    // Gerar QR Code PIX na tela
    if (document.getElementById('qrcode-pix')) {
      new QRCode(document.getElementById('qrcode-pix'), {
        text: copiaECola || 'https://pix.exemplo.com',
        width: 180,
        height: 180
      });
    }

    function copiarPix() {
      navigator.clipboard.writeText(copiaECola);
      document.getElementById('copy-msg').classList.remove('hidden');
      setTimeout(() => document.getElementById('copy-msg').classList.add('hidden'), 3000);
    }

    // Cronômetro Regressivo de 15 Minutos
    let tempoRestante = 15 * 60;
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
      const min = Math.floor(tempoRestante / 60);
      const sec = tempoRestante % 60;
      timerElement.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
      
      if (tempoRestante <= 0) {
        clearInterval(countdown);
        alert('Tempo de pagamento expirado! Por favor, refaça o pedido.');
        window.location.href = 'index.html';
      }
      tempoRestante--;
    }, 1000);

    // Polling a cada 3s verificando se foi pago
    const checkStatus = setInterval(async () => {
      try {
        if (!orderId) return;
        const res = await fetch(`/api/orders/${orderId}`);
        if (res.ok) {
          const data = await res.json();
          if (data.status === 'paid') {
            clearInterval(checkStatus);
            clearInterval(countdown);
            window.location.href = `ingresso.html?orderId=${orderId}&nome=${encodeURIComponent(nome)}&cpf=${encodeURIComponent(cpf)}`;
          }
        }
      } catch (e) {}
    }, 3000);

    async function simularAprovacao() {
      if (!orderId) {
        alert('Erro: sem ID de pedido para simular.');
        return;
      }
      await fetch('/api/webhooks/payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event_type: 'payment.approved',
          data: { orderId: orderId, customer: { name: nome, cpf: cpf } }
        })
      });
    }
  </script>
</body>
</html>
