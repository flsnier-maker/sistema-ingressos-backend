<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Ingresso Digital - TicketPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
    
    <!-- Topo do Bilhete -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-center">
      <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Ingresso Confirmado</span>
      <h1 class="text-2xl font-black text-white mt-3">FESTIVAL POP & ROCK</h1>
      <p class="text-xs text-indigo-100 mt-1"><i class="fa-regular fa-calendar mr-1"></i> 15 de Novembro de 2026 • 20:00h</p>
    </div>

    <!-- Divisória Estilo Ticket -->
    <div class="relative bg-slate-900 h-6 flex items-center justify-between px-2">
      <div class="w-6 h-6 bg-slate-950 rounded-full -ml-5"></div>
      <div class="border-b-2 border-dashed border-slate-800 w-full mx-2"></div>
      <div class="w-6 h-6 bg-slate-950 rounded-full -mr-5"></div>
    </div>

    <!-- Corpo do Bilhete -->
    <div class="p-6 text-center space-y-6">
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Titular do Ingresso</p>
        <p id="holder-name" class="text-xl font-bold text-white mt-1">Carregando...</p>
        <p id="holder-cpf" class="text-xs text-slate-400 mt-1">CPF: ---</p>
      </div>

      <!-- Container do QR Code -->
      <div class="bg-white p-4 rounded-2xl flex flex-col items-center justify-center min-h-[220px]">
        <div id="qrcode-container" class="flex flex-col items-center">
          <p class="text-slate-600 font-semibold text-sm mb-2">Simulação de Pagamento PENDENTE</p>
          <button onclick="aprovarPixSimulado()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-check-circle"></i> SIMULAR PAGAMENTO PIX
          </button>
        </div>
      </div>

      <p class="text-xs text-slate-400">Aproxime este QR Code do leitor na portaria do evento.</p>

      <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold py-3 rounded-xl transition">
        <i class="fa-solid fa-print mr-2"></i> Salvar / Imprimir
      </button>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    const nome = urlParams.get('nome') || 'Lamonnier';
    const cpf = urlParams.get('cpf') || '02692636325';
    const quantidade = urlParams.get('quantidade') || 1;

    document.getElementById('holder-name').innerText = nome;
    document.getElementById('holder-cpf').innerText = `CPF: ${cpf}`;

   async function aprovarPixSimulado() {
  const container = document.getElementById('qrcode-container');
  container.innerHTML = `<p class="text-slate-600 font-semibold text-sm">A processar pagamento e a emitir QR Code...</p>`;

  try {
    const res = await fetch('/api/webhooks/payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_type: 'payment.approved',
        data: {
          orderId: orderId,
          paymentProviderId: 'pix_simulado_' + Date.now(),
          customer: { name: nome, cpf: cpf }
        }
      })
    });

    const data = await res.json();

    if (res.ok && data.tickets && data.tickets.length > 0) {
      const qrImage = data.tickets[0].qrCodeImage;
      container.innerHTML = `
        <img src="${qrImage}" alt="QR Code Ingresso" class="w-48 h-48 border-2 border-slate-200 rounded-lg"/>
        <p class="text-xs text-emerald-600 font-bold mt-2"><i class="fa-solid fa-circle-check"></i> Pagamento Aprovado!</p>
      `;
    } else {
      container.innerHTML = `<p class="text-red-500 font-bold text-xs p-2">Erro ao emitir ingresso: ${data.error || 'Falha no servidor'}</p>`;
    }
  } catch (err) {
    container.innerHTML = `<p class="text-red-500 font-bold text-xs p-2">Erro ao conectar com a API</p>`;
  }
}
  </script>

</body>
</html>
