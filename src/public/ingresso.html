<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Ingresso Digital - TicketPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative">
    
    <!-- Cabeçalho do Ticket -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-center relative">
      <span class="bg-white/20 text-white text-[10px] font-extrabold uppercase px-3 py-1 rounded-full tracking-wider border border-white/20">
        Ingresso Confirmado
      </span>
      <h1 id="event-title-display" class="text-2xl font-black text-white mt-3 uppercase tracking-wide">
        SHOW FREI GILSON
      </h1>
      <p class="text-xs text-indigo-100 mt-1 flex items-center justify-center gap-1">
        <i class="fa-regular fa-calendar"></i> Em breve • 20:00h
      </p>
    </div>

    <!-- Divisor Estilo Ticket -->
    <div class="relative flex items-center justify-between px-4 -my-3 z-10">
      <div class="w-6 h-6 bg-slate-950 rounded-full border-r border-slate-800"></div>
      <div class="border-b-2 border-dashed border-slate-800 flex-1 mx-2"></div>
      <div class="w-6 h-6 bg-slate-950 rounded-full border-l border-slate-800"></div>
    </div>

    <!-- Dados do Titular -->
    <div class="p-6 space-y-6 text-center">
      <div>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Titular do Ingresso</p>
        <h2 id="holder-name" class="text-xl font-bold text-white mt-1">Carregando...</h2>
        <p id="holder-cpf" class="text-xs text-slate-400 mt-0.5">CPF: ---</p>
      </div>

      <!-- QR Code Container -->
      <div class="bg-white p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner">
        <div id="qrcode" class="flex justify-center items-center"></div>
        <p id="qr-status" class="text-xs font-bold text-emerald-600 mt-3 flex items-center gap-1">
          <i class="fa-solid fa-circle-check"></i> Pagamento Aprovado!
        </p>
      </div>

      <p class="text-[11px] text-slate-400">Aproxime este QR Code do leitor na portaria do evento.</p>

      <!-- Botão para Imprimir / Salvar -->
      <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-print"></i> Salvar / Imprimir
      </button>
    </div>

  </div>

  <script>
    // Extrai os parâmetros da URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || '00000000-0000-0000-0000-000000000000';
    const nome = urlParams.get('nome') || 'Titular Não Informado';
    const cpf = urlParams.get('cpf') || '000.000.000-00';

    document.getElementById('holder-name').innerText = decodeURIComponent(nome);
    document.getElementById('holder-cpf').innerText = `CPF: ${decodeURIComponent(cpf)}`;

    // Gerador de QR Code
    const qrcodeContainer = document.getElementById('qrcode');
    qrcodeContainer.innerHTML = '';
    
    new QRCode(qrcodeContainer, {
      text: orderId,
      width: 180,
      height: 180,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
