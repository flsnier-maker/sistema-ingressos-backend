<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io('http://localhost:3000');
  const EVENT_ID = 'id-do-evento-aqui';

  // Entra na sala do evento
  socket.emit('join_event_room', EVENT_ID);

  // Escuta novas vendas em tempo real
  socket.on('new_sale', (data) => {
    console.log('Nova venda realizada!', data);
    alert(`🎉 Nova venda! ${data.totalTickets} ingressos vendidos por R$ ${data.totalAmount}`);
  });
</script>
